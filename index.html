<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <title>Non-Standard Item Request Form</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    /* -------------------------------------------------------------------------- */
    /* BASE STYLES */
    /* -------------------------------------------------------------------------- */
    body { font-family: sans-serif; margin: 20px; background-color: #f8f9fa; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .header { text-align: center; margin-bottom: 20px; }
    .header img { width: 120px; height: auto; margin-bottom: 10px; border-radius: 50%; }
    h1 { color: #007bff; font-size: 1.8em; margin-bottom: 5px; }
    h2 { color: #6c757d; font-size: 1.1em; font-weight: normal; margin-top: 0; }
    label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ced4da; border-radius: 4px; box-sizing: border-box; }
    button { background-color: #28a745; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; margin-top: 20px; width: 100%; }
    button:hover { background-color: #218838; }
    .add-btn { background-color: #007bff; width: auto; padding: 8px 15px; font-size: 0.9em; margin-top: 10px; margin-bottom: 15px; }
    .add-btn:hover { background-color: #0056b3; }
    .success { background-color: #e6ffed; color: #28a745; }
    .error { background-color: #ffe6e6; color: red; }
    #message-area { margin-top: 20px; padding: 10px; border-radius: 4px; text-align: center; display: none; }
    
    /* -------------------------------------------------------------------------- */
    /* ICON / INPUT / MODAL STYLES */
    /* -------------------------------------------------------------------------- */
    .serial-box-input-group {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
    }
    .serial-box-input-group input {
        flex-grow: 1;
        margin-bottom: 0;
        border-right: none;
        border-radius: 4px 0 0 4px;
    }
    .scan-btn {
        background-color: #6c757d;
        color: white;
        padding: 10px;
        width: 40px;
        height: 40px;
        border: 1px solid #ced4da;
        border-radius: 0 4px 4px 0;
        cursor: pointer;
        margin-top: 0;
        font-size: 1em;
        line-height: 1;
        transition: background-color 0.2s;
        box-sizing: border-box; 
    }
    .scan-btn:hover {
        background-color: #5a6268;
    }
    
    /* Modal styles */
    .modal {
        display: none; 
        position: fixed; 
        z-index: 1000; 
        left: 0;
        top: 0;
        width: 100%; 
        height: 100%; 
        overflow: auto; 
        background-color: rgba(0,0,0,0.8); 
    }
    .modal-content {
        background-color: #fefefe;
        margin: 10% auto;
        padding: 20px;
        border: 1px solid #888;
        width: 80%;
        max-width: 450px;
        border-radius: 8px;
        text-align: center;
    }
    .close-btn {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
    }
    .close-btn:hover,
    .close-btn:focus {
        color: #000;
        text-decoration: none;
        cursor: pointer;
    }

    /* Footer Style */
    .footer {
        margin-top: 40px;
        padding-top: 15px;
        border-top: 1px solid #ced4da;
        font-size: 0.8em;
        color: #6c757d;
        text-align: center;
    }
    /* Style for the hidden "Other" input */
    #otherWardInput {
        display: none;
        margin-top: -5px;
        margin-bottom: 15px;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <img src="https://lh3.googleusercontent.com/d/1tCDAMimy_b0x9kRmWNyYMn4voR9Ynr0J" alt="Logo">
    <h1>Non-Standard Item Request Form</h1>
    <h2>Haemodialysis Unit, Sarawak General Hospital</h2>
  </div>

  <form id="requestForm">
    
    <label for="ward">Ward/Unit</label>
    <select id="ward" name="ward" required onchange="toggleOtherWardInput(this.value)"> 
      <option value="" disabled selected>Select Ward/Unit</option>
      <option>Emergency Dept</option>
      <option>Radiology Dept</option>
      <option>Medical Day Care</option>
      <option>Medical 4 Ward</option>
      <option>Intensive Care Unit</option>
      <option>Intensive Care Unit 2</option>
      <option>Paed ICU</option>
      <option>NICU</option>
      <option>Medical 3 Ward</option>
      <option>ID Ward</option>
      <option>Medical 5 Ward</option>
      <option>Female Medical Ward</option>
      <option>Male Medical Ward</option>
      <option>Female Surgical Ward</option>
      <option>Male Surgical Ward</option>
      <option>Female Ortho Ward</option>
      <option>Male Ortho Ward</option>
      <option>Pusat Jantung Sarawak</option>
      <option>Hospital Serian</option>
      <option>Hospital Sri Aman</option>
      <option value="Other">Other (Please Specify)</option>
    </select>

    <input type="text" id="otherWardInput" name="otherWardInput" placeholder="Specify Ward/Unit Name" />

    <label for="takenBy">Taken by</label>
    <input type="text" id="takenBy" name="takenBy" required>

    <label>Serial No (Click camera icon to scan)</label>
    <div id="serial-numbers-container">
    </div>
    
    <button type="button" class="add-btn" onclick="addSerialBoxes(1)">+ Add More Item</button>

    <button type="submit" id="submitBtn">Submit Request</button>
    
    <div id="message-area"></div>

  </form>
</div>

<div class="footer">
    &copy; Designed and developed by PPP Zulfadlie bin Janie<br>
    for Haemodialysis Unit, Sarawak General Hospital
</div>

<div id="scannerModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="stopAndHideScanner()">&times;</span>
        <h2>Scan QR Code</h2>
        <div id="reader-modal" style="width: 100%;"></div>
        <p id="scan-status" style="font-size: 0.8em; color: gray;">Place QR code within the view.</p>
    </div>
</div>

<script>
    // Live Google Apps Script Web App Deployment URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyRZPJxJQT84Z_lWA_9k3dj3gbHDYReRkmQD-uGgadIBTpavO02ToXPhO1jiSAwqdQ/exec";

    const SERIAL_BOX_COUNT = 1; 
    let serialBoxCounter = 0;
    const container = document.getElementById('serial-numbers-container');
    const modal = document.getElementById('scannerModal');
    let html5QrCode = null;
    let activeInputId = null; 

    const otherWardInput = document.getElementById('otherWardInput');
    const wardSelect = document.getElementById('ward');
    
    /**
     * Plays a short confirmation beep sound using the Web Audio API.
     */
    function playScanBeep() {
        try {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(440, audioContext.currentTime);

            oscillator.start();

            setTimeout(() => {
                oscillator.stop();
            }, 150);

        } catch (e) {
            console.warn("Web Audio API not supported or failed to start: ", e);
        }
    }

    /**
     * Toggles the visibility and required status of the "Other" textbox.
     */
    function toggleOtherWardInput(selectedValue) {
        if (selectedValue === 'Other') {
            otherWardInput.style.display = 'block';
            otherWardInput.setAttribute('required', 'required');
            otherWardInput.focus();
        } else {
            otherWardInput.style.display = 'none';
            otherWardInput.removeAttribute('required');
            otherWardInput.value = '';
        }
    }

    // --------------------------------------------------------------------------
    // SCANNER LOGIC 
    // --------------------------------------------------------------------------

    function startScanner(inputId) {
        activeInputId = inputId;
        modal.style.display = 'block';

        const status = document.getElementById('scan-status');
        status.textContent = 'Starting camera...';

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            status.textContent = 'Camera API unavailable.';
            return;
        }

        if (html5QrCode && html5QrCode.isScanning) {
            status.textContent = 'Scanner is already active.';
            return;
        }

        try {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode('reader-modal');
            }

            const config = {
                fps: 10,
                qrbox: { width: 200, height: 200 }
            };

            html5QrCode.start(
                { facingMode: 'environment' },
                config,
                onScanSuccess,
                onScanFailure
            ).then(function() {
                status.textContent = 'Scanner active. Point camera at QR Code.';
            }).catch(function(err) {
                console.error('Camera start failed:', err);
                const detail = String(err && err.message ? err.message : err);
                status.textContent = 'Unable to start camera: ' + detail + '. Check permissions or HTTPS.';
            });

        } catch (err) {
            console.error('Scanner initialization failed:', err);
            status.textContent = 'Scanner initialization failed: ' + err.message;
        }
    }

    function stopAndHideScanner() {
        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().then(() => {
                modal.style.display = 'none';
                activeInputId = null;
            }).catch(err => {
                console.warn("Failed to stop scanner:", err);
                modal.style.display = 'none';
                activeInputId = null;
            });
        } else {
            modal.style.display = 'none';
            activeInputId = null;
        }
    }

    function onScanSuccess(decodedText, decodedResult) {
        stopAndHideScanner(); 
        
        const input = document.getElementById(activeInputId);
        
        if (input && decodedText.trim() !== "") {
            if (!isDuplicateSerial(decodedText)) {
                playScanBeep();
                input.value = decodedText.trim();
                findNextEmptyInput()?.focus(); 
            } else {
                showMessage(`Serial No. ${decodedText.trim()} already scanned!`, 'error');
            }
        }
    }

    function onScanFailure(errorMessage) {
        // Ignored
    }
    
    function isDuplicateSerial(serialText) {
        const inputs = document.querySelectorAll('#serial-numbers-container input');
        for (const input of inputs) {
            if (input.id !== activeInputId && input.value.trim() === serialText.trim()) {
                return true;
            }
        }
        return false;
    }
    
    function findNextEmptyInput() {
        const inputs = document.querySelectorAll('#serial-numbers-container input');
        for (const input of inputs) {
            if (input.value.trim() === "") {
                return input;
            }
        }
        return null;
    }

    // --------------------------------------------------------------------------
    // FORM STRUCTURE LOGIC 
    // --------------------------------------------------------------------------

    function addSerialBoxes(count) {
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < count; i++) {
            serialBoxCounter++;
            const inputId = `serialNo_${serialBoxCounter}`;
            const div = document.createElement('div');
            div.className = 'serial-box';
            
            const isFirstBox = serialBoxCounter === 1;
            const requiredAttr = isFirstBox ? 'required' : ''; 
            
            div.innerHTML = `
                <div class="serial-box-input-group">
                    <input type="text" 
                           id="${inputId}"
                           name="${inputId}" 
                           placeholder="Scan or enter Serial No" 
                           ${requiredAttr}>
                    <button type="button" class="scan-btn" onclick="startScanner('${inputId}')" title="Activate QR Scanner">
                        &#128247;
                    </button>
                </div>
            `;
            fragment.appendChild(div);
        }
        container.appendChild(fragment);
    }
    
    // --------------------------------------------------------------------------
    // SUBMISSION LOGIC 
    // --------------------------------------------------------------------------
    
    document.getElementById('requestForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        stopAndHideScanner(); 
        
        const form = e.target;
        const messageArea = document.getElementById('message-area');
        messageArea.style.display = 'none';
        
        let finalWardValue = wardSelect.value;
        if (finalWardValue === 'Other') {
            finalWardValue = otherWardInput.value.trim();
        }
        
        const formData = {
            ward: finalWardValue,
            takenBy: form.takenBy.value.trim(),
            serialNumbers: []
        };
        
        document.querySelectorAll('#serial-numbers-container input').forEach(input => {
            if (input.value.trim() !== "") {
                formData.serialNumbers.push(input.value.trim());
            }
        });

        if (formData.serialNumbers.length === 0) {
            showMessage("Please scan or enter at least ONE Serial Number.", 'error');
            return;
        }

        document.getElementById('submitBtn').disabled = true;

        fetch(SCRIPT_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'text/plain;charset=utf-8',
            },
            body: JSON.stringify({
                action: 'saveRequest',
                payload: formData
            })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.json();
        })
        .then(result => {
            document.getElementById('submitBtn').disabled = false;
            if (result.success) {
                showMessage(result.message, 'success');
                form.reset(); 
                container.innerHTML = "";
                serialBoxCounter = 0;
                addSerialBoxes(1);
                toggleOtherWardInput(''); 
            } else {
                showMessage("Error saving request: " + result.error, 'error');
            }
        })
        .catch(error => {
            document.getElementById('submitBtn').disabled = false;
            showMessage("Server error: " + error, 'error');
        });
    });
    
    function showMessage(text, type) {
        const messageArea = document.getElementById('message-area');
        messageArea.textContent = text;
        messageArea.className = type;
        messageArea.style.display = 'block';
    }

    window.onload = function() {
        addSerialBoxes(1);
        toggleOtherWardInput('');
    };
    
    window.onclick = function(event) {
      if (event.target == modal) {
        stopAndHideScanner();
      }
    }
</script>
</body>
</html>
